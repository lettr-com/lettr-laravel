name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        include:
          - laravel: 10.*
            testbench: ^8.17
          - laravel: 11.*
            testbench: ^9.0
          - laravel: 12.*
            testbench: ^10.8
          - laravel: 13.*
            testbench: ^11.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Allow end-of-life Laravel 10
        if: matrix.laravel == '10.*'
        # Laravel 10 is past end of life and every release now carries a security
        # advisory, so Composer refuses to install any of them by default. Lifting
        # that here only affects this test run, not what users install.
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint (code style)
        run: composer lint -- --test

      - name: Run PHPStan (static analysis)
        run: composer analyse

      - name: Run Pest (tests)
        run: composer test
